# 安装包里的核心、网页软件用哪一版（施工 DT-6）。升级：改 rev、推 step/ 分支跑三台的「打包」、出包手测，再打发版的 tag。
# 写完整的提交号。核心要 CL-7 以后的（miyu web 转交给网页包里的程序）；网页照它的 main，不照核心 heads.toml 里钉的那一版。

[core]
repo = "miyu-agent/miyu"
rev = "91481c3668c1057fd2d0109757d1cbbf322d87df"

[web]
repo = "miyu-agent/miyu-web"
rev = "fc46afd0944a850a48e444e6e323d23190009bd8"

