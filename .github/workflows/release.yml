# 打安装包（施工 DT-6，蓝图 desktop.md「装在哪」）：照 pins.toml 取核心、网页软件编 release，搭好内容，Tauri 打包。
# step/ 分支、手动触发只打包、传到这次运行的附件里（出包手测）；打 v 开头的 tag 才建发版（预发布，没签名）。
name: 打包

on:
  push:
    branches: ["step/**"]
    tags: ["v*"]
    # 只改文档的不重新打包（tag 照打）。
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            config: packaging/linux.json
          - os: macos-latest
            config: packaging/macos.json
          - os: windows-latest
            config: packaging/windows.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 读钉的版本
        id: pins
        shell: bash
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          pins = tomllib.load(open('pins.toml', 'rb'))
          for part in ('core', 'web'):
              print(f"{part}-repo={pins[part]['repo']}")
              print(f"{part}-rev={pins[part]['rev']}")
          EOF
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.core-repo }}
          ref: ${{ steps.pins.outputs.core-rev }}
          path: _core
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.web-repo }}
          ref: ${{ steps.pins.outputs.web-rev }}
          path: _web
      - name: 装 Tauri 要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm
      - name: 装三个仓库各自钉住的工具链
        shell: bash
        run: |
          rustup toolchain install
          (cd _core && rustup toolchain install)
          (cd _web && rustup toolchain install)
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
          key: pack
          workspaces: |
            .
            _core
            _web
      - name: 编核心
        working-directory: _core
        run: cargo build --release --locked -p miyu -p miyu-sandbox -p miyu-extract
      - name: 编网页软件
        working-directory: _web
        run: cargo build --release --locked -p miyu-web
      - name: 搭安装包的内容
        shell: bash
        run: |
          python3 packaging/stage.py --core _core --web _web --triple "$(rustc -vV | sed -n 's/^host: //p')" --out dist
      - name: 包里的核心照常起得来
        shell: bash
        run: |
          for p in dist/binaries/miyu-*; do case "$p" in *miyu-sandbox*|*miyu-extract*) ;; *) "$p" --version ;; esac; done
          cat dist/pins.txt
      - name: 装 Tauri 的打包工具
        run: cargo install tauri-cli --version =2.12.4 --locked
      - name: 打包
        run: cargo tauri build --ci --config ${{ matrix.config }}
      - name: 收安装包
        shell: bash
        run: |
          mkdir -p out
          find target/release/bundle \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"
      - name: 填 AUR 的 PKGBUILD
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=$(ls out/*.deb)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$(sha256sum "$deb" | cut -d' ' -f1)/" packaging/aur/PKGBUILD.in > out/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: miyu-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: 传进发版
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes="$(printf '没签名的测试版。\n\n%s\n' "$(cat dist/pins.txt)")"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "Miyu 桌面端 $tag" --notes "$notes" || true
          gh release upload "$tag" out/* --clobber
